<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Wedding - リアル見積もり＆節約シミュレーター</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="結婚式の見積もり「闇」ポイントを可視化！初期見積もりから最終費用の差額をシミュレーション。ご祝儀・会費制対応の節約シミュレーターで自己負担額をリアルに把握。">
    <meta name="keywords" content="結婚式,見積もり,シミュレーター,節約,ウェディング,結婚指輪,ご祝儀">
    <meta name="author" content="Luxe Wedding">
    <meta property="og:title" content="リアル見積もり「闇」シミュレーター | Luxe Wedding">
    <meta property="og:description" content="結婚式の隠れコストを可視化。初期見積もりから平均80〜120万円も上昇する実態を先輩花嫁のリアルデータでシミュレーション。">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 50: '#fdfbf7', 100: '#f4ebd0', 500: '#c5a059', 600: '#a8833e', 700: '#8c6b2e' },
                        wedding: { bg: '#fcfbf9', card: '#ffffff', text: '#2c2c2c', muted: '#717171' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #fcfbf9; color: #2c2c2c; }
        .serif-title { font-family: 'Cormorant Garamond', serif; }
        .shadow-custom { box-shadow: 0 10px 30px -5px rgba(197, 160, 89, 0.08); }
        .smooth-transition { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-wedding-bg min-h-screen pb-24">

    <header class="bg-white/90 border-b border-gold-100 py-5 px-4 text-center sticky top-0 z-50 backdrop-blur-md shadow-sm">
        <p class="serif-title text-gold-500 tracking-widest text-xs font-semibold uppercase mb-1">Wedding Financial Intelligence</p>
        <h1 class="text-xl font-bold tracking-wide text-gray-800">リアル見積もり「闇」シミュレーター</h1>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

        <!-- リアルタイム結果ダッシュボード -->
        <section class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white p-5 rounded-2xl shadow-xl relative overflow-hidden">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 relative z-10 text-center items-center divide-x divide-slate-700/50">
                <div class="p-1">
                    <p class="text-[10px] md:text-xs text-gold-400 tracking-wider">式場＋指輪 総額</p>
                    <p id="grandTotal" class="text-base md:text-lg font-medium mt-1">0円</p>
                </div>
                <div class="p-1">
                    <p class="text-[10px] md:text-xs text-green-400 tracking-wider">ゲスト回収額（-）</p>
                    <p id="goshugiTotal" class="text-base md:text-lg font-medium mt-1">0円</p>
                </div>
                <div class="col-span-2 md:col-span-2 bg-slate-800/80 rounded-xl p-3 border border-slate-700/50 shadow-inner">
                    <p class="text-xs text-gold-300 tracking-wider font-bold">最終的な実質自己負担額</p>
                    <p id="realBurden" class="text-2xl md:text-3xl font-bold text-gold-400 mt-1 smooth-transition">0円</p>
                </div>
            </div>
            
            <div class="mt-4 pt-4 border-t border-slate-700/50">
                <div class="flex items-start space-x-2">
                    <span class="bg-red-500/20 border border-red-500/50 text-red-300 text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap mt-0.5">先輩花嫁のリアル</span>
                    <p class="text-xs text-slate-300 leading-relaxed">
                        初期見積もりから最終費用は <strong class="text-white border-b border-red-400">平均 ＋80万〜120万円</strong> 上昇します。下部の項目をチェックしてリアルな相場を確認してください。
                    </p>
                </div>
            </div>
        </section>

        <!-- タブナビゲーション -->
        <div class="flex border-b border-gold-100 justify-start md:justify-center space-x-2 overflow-x-auto whitespace-nowrap px-1 pb-1">
            <button onclick="switchTab('venue')" id="tab-venue" class="pb-2 border-b-2 border-gold-500 text-gold-700 font-bold text-sm px-3 smooth-transition">1. 基本・闇チェック</button>
            <button onclick="switchTab('bring')" id="tab-bring" class="pb-2 border-b-2 border-transparent text-wedding-muted hover:text-gold-600 text-sm px-3 smooth-transition">2. 節約アクション</button>
            <button onclick="switchTab('ring')" id="tab-ring" class="pb-2 border-b-2 border-transparent text-wedding-muted hover:text-gold-600 text-sm px-3 smooth-transition">3. 結婚指輪</button>
        </div>

        <!-- タブ1：式場関連・闇チェック -->
        <div id="section-venue" class="space-y-5 animate-fade-in">
            <div class="bg-white p-5 rounded-2xl shadow-custom border border-gold-50 space-y-4">
                <h2 class="text-base font-bold border-l-4 border-gold-500 pl-2">基本設定</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-wedding-muted mb-1" for="guestCount">招待人数</label>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="guestCount" value="60" min="10" max="150" oninput="calculate()" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-gold-500 focus:border-transparent text-base">
                            <span class="text-sm text-wedding-muted">名</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-wedding-muted mb-1" for="initialEstimate">初期見積もり額</label>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="initialEstimate" value="2500000" step="50000" oninput="calculate()" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-gold-500 focus:border-transparent text-base">
                            <span class="text-sm text-wedding-muted">円</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-wedding-muted mb-1" for="contributionType">お祝い金の形式</label>
                        <select id="contributionType" onchange="calculate()" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-gold-500 focus:border-transparent text-sm bg-white">
                            <option value="30000">ご祝儀制（相場：約3.0万円/人）</option>
                            <option value="18000" selected>会費制（相場：約1.8万円/人）</option>
                            <option value="0">自己負担（リゾート婚など）</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-custom border border-gold-50 space-y-3">
                <h2 class="text-base font-bold border-l-4 border-gold-500 pl-2">見積もり爆上がり「闇」ポイント</h2>
                <div class="space-y-2">
                    <label class="flex items-center p-3 rounded-xl hover:bg-gold-50/50 cursor-pointer border border-gray-100 smooth-transition active:bg-gold-100">
                        <input type="checkbox" id="chk-food" checked onchange="calculate()" class="w-5 h-5 text-gold-600 rounded border-gray-300 focus:ring-gold-500">
                        <div class="ml-3 flex-1">
                            <p class="font-bold text-sm text-gray-800">料理・ドリンクのランクアップ</p>
                            <p class="text-xs text-wedding-muted">人数 × 5,000円追加（最低ランク回避）</p>
                        </div>
                    </label>
                    <label class="flex items-center p-3 rounded-xl hover:bg-gold-50/50 cursor-pointer border border-gray-100 smooth-transition active:bg-gold-100">
                        <input type="checkbox" id="chk-dress" checked onchange="calculate()" class="w-5 h-5 text-gold-600 rounded border-gray-300 focus:ring-gold-500">
                        <div class="ml-3 flex-1">
                            <p class="font-bold text-sm text-gray-800">新婦ドレスのランクUP ＆ お色直し</p>
                            <p class="text-xs text-wedding-muted">一律 ＋180,000円追加</p>
                        </div>
                    </label>
                    <label class="flex items-center p-3 rounded-xl hover:bg-gold-50/50 cursor-pointer border border-gray-100 smooth-transition active:bg-gold-100">
                        <input type="checkbox" id="chk-flower" checked onchange="calculate()" class="w-5 h-5 text-gold-600 rounded border-gray-300 focus:ring-gold-500">
                        <div class="ml-3 flex-1">
                            <p class="font-bold text-sm text-gray-800">会場装花（お花）のボリュームアップ</p>
                            <p class="text-xs text-wedding-muted">一律 ＋90,000円追加（写真映え）</p>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- タブ2：節約アクション -->
        <div id="section-bring" class="space-y-5 hidden">
            <div class="bg-white p-5 rounded-2xl shadow-custom border border-gold-50 space-y-3">
                <h2 class="text-base font-bold border-l-4 border-gold-500 pl-2">持ち込み ＆ 外部手配による節約</h2>
                <div class="space-y-2">
                    <label class="flex items-center p-3 rounded-xl hover:bg-gold-50/50 cursor-pointer border border-gray-100 smooth-transition active:bg-gold-100">
                        <input type="checkbox" id="chk-paper-bring" onchange="calculate()" class="w-5 h-5 text-gold-600 rounded border-gray-300 focus:ring-gold-500">
                        <div class="ml-3 flex-1">
                            <p class="font-bold text-sm text-gray-800">ペーパーアイテムの自作・外注</p>
                            <p class="text-xs text-green-600 font-medium">約 -40,000円 節約</p>
                        </div>
                    </label>
                    <label class="flex items-center p-3 rounded-xl hover:bg-gold-50/50 cursor-pointer border border-gray-100 smooth-transition active:bg-gold-100">
                        <input type="checkbox" id="chk-movie-hand" onchange="calculate()" class="w-5 h-5 text-gold-600 rounded border-gray-300 focus:ring-gold-500">
                        <div class="ml-3 flex-1">
                            <p class="font-bold text-sm text-gray-800">各種ムービーの自作・格安外注</p>
                            <p class="text-xs text-green-600 font-medium">約 -70,000円 節約</p>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- タブ3：指輪 -->
        <section id="section-ring" class="space-y-5 hidden">
            <div class="bg-white p-5 rounded-2xl shadow-custom border border-gold-50 space-y-4">
                <h2 class="text-base font-bold border-l-4 border-gold-500 pl-2">結婚指輪のこだわり（ペア）</h2>
                <select id="ringTier" onchange="calculate()" class="w-full px-3 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-gold-500 text-sm bg-white font-medium">
                    <option value="150000">ノーブランド・シンプル（約15万円）</option>
                    <option value="280000">国内人気ブランド（約28万円）</option>
                    <option value="450000" selected>ハイブランド / Boucheron等（約45万円）</option>
                </select>
            </div>
        </section>

    </main>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('[id^="section-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('border-gold-500', 'text-gold-700', 'font-bold');
                el.classList.add('border-transparent', 'text-wedding-muted');
            });
            
            document.getElementById('section-' + tabName).classList.remove('hidden');
            const activeTab = document.getElementById('tab-' + tabName);
            activeTab.classList.remove('border-transparent', 'text-wedding-muted');
            activeTab.classList.add('border-gold-500', 'text-gold-700', 'font-bold');
        }

        function calculate() {
            const guest = parseInt(document.getElementById('guestCount').value) || 0;
            const initial = parseInt(document.getElementById('initialEstimate').value) || 0;
            const contributionRate = parseInt(document.getElementById('contributionType').value) || 0;

            const totalGoshugi = guest * contributionRate;

            let venueCost = initial;
            if (document.getElementById('chk-food').checked) venueCost += (5000 * guest);
            if (document.getElementById('chk-dress').checked) venueCost += 180000;
            if (document.getElementById('chk-flower').checked) venueCost += 90000;

            let savingCost = 0;
            if (document.getElementById('chk-paper-bring').checked) savingCost -= 40000;
            if (document.getElementById('chk-movie-hand').checked) savingCost -= 70000;

            const finalVenue = venueCost + savingCost;
            const finalRing = parseInt(document.getElementById('ringTier').value) || 0;
            
            const grandTotal = finalVenue + finalRing;
            const realBurden = grandTotal - totalGoshugi;

            document.getElementById('grandTotal').innerText = grandTotal.toLocaleString() + '円';
            document.getElementById('goshugiTotal').innerText = totalGoshugi.toLocaleString() + '円';
            
            const burdenEl = document.getElementById('realBurden');
            if(realBurden > 0) {
                burdenEl.innerText = realBurden.toLocaleString() + '円';
                burdenEl.classList.remove('text-green-400');
                burdenEl.classList.add('text-gold-400');
            } else {
                burdenEl.innerText = "黒字（+" + Math.abs(realBurden).toLocaleString() + "円）";
                burdenEl.classList.remove('text-gold-400');
                burdenEl.classList.add('text-green-400');
            }
        }
        calculate();
    </script>
</body>
</html>
